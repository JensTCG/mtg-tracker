<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#121212">
  <title>Podboard</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
</head>
<body>
  <header>
    <span id="titel">Podboard</span>
    <span>
      <button class="klein-btn" data-aktion="neu">Neu</button>
      <button class="klein-btn" data-aktion="einstellungen" aria-label="Einstellungen">⚙︎</button>
    </span>
  </header>
  <div id="sync" role="status" hidden></div>
  <main id="inhalt"></main>
  <nav id="nav">
    <p id="meldung" role="status"></p>
    <div id="knoepfe"></div>
  </nav>
  <script src="app.js"></script>
</body>
</html>
